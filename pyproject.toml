[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsmr"
version = "0.1.0"
description = "Wake-Sleep Margin Regularization for neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["wslgmr*", "configs*"]

[tool.ruff]
line-length = 88
target-version = "py310"
